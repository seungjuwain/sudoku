<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스도쿠 플레이그라운드</title>
<style>
:root {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #172033;
  background: #f4f7fb;
}
* { box-sizing: border-box; }
body { margin: 0; padding: 24px 14px 48px; }
.app { max-width: 850px; margin: auto; }
.hero { text-align: center; margin: 12px 0 24px; }
.hero h1 { margin: 0 0 8px; font-size: clamp(28px, 5vw, 40px); }
.hero p { margin: 0; color: #637087; }
.panel {
  background: white;
  border: 1px solid #e1e7f0;
  border-radius: 18px;
  padding: 20px;
  margin: 14px 0;
  box-shadow: 0 8px 25px #2636530a;
}
.hidden { display: none !important; }
.choices {
  display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;
}
.button {
  border: 0; border-radius: 11px; padding: 12px 18px;
  font-size: 15px; font-weight: 700; cursor: pointer;
  background: #e8edf5; color: #243047;
}
.button.primary { background: #315fe8; color: white; }
.button.dark { background: #172033; color: white; }
.button:hover { filter: brightness(.97); }
.subheading { text-align: center; margin: 0 0 15px; }
.muted { color: #64748b; font-size: 14px; }
.toolbar {
  display: flex; gap: 8px; flex-wrap: wrap;
  align-items: center; justify-content: center; margin: 14px 0;
}
.board-wrap {
  overflow-x: auto; padding: 2px;
  display: flex; justify-content: center;
}
.board {
  display: grid;
  border: 2px solid #000;
  flex: 0 0 auto;
  user-select: none;
}
.cell {
  width: clamp(30px, 6vw, 54px);
  height: clamp(30px, 6vw, 54px);
  min-width: 30px;
  border: 0;
  border-right: 1px solid #aeb7c5;
  border-bottom: 1px solid #aeb7c5;
  text-align: center;
  padding: 0;
  background: white;
  color: #1f2937;
  font-size: clamp(15px, 3vw, 23px);
  font-weight: 600;
  border-radius: 0;
  outline-offset: -3px;
}

/* 9×9는 3×3, 16×16은 4×4 구역마다 검은 실선 */
.cell.box-right { border-right: 2px solid #000 !important; }
.cell.box-bottom { border-bottom: 2px solid #000 !important; }

.board.size16 .cell {
  width: clamp(23px, 4.1vw, 42px);
  height: clamp(23px, 4.1vw, 42px);
  min-width: 23px;
  font-size: clamp(12px, 2vw, 17px);
}
.cell.given { background: #edf2fb; font-weight: 800; }
.cell.selected { background: #dce8ff; }
.cell.related { background: #f5f8fd; }
.cell.conflict { background: #ffe0e0; color: #b42318; }
.cell.solved { color: #176b45; }
.cell:focus { background: #dce8ff; }

.status {
  margin: 14px auto 0;
  padding: 12px 14px;
  border-radius: 11px;
  max-width: 680px;
  background: #f0f5ff;
  line-height: 1.55;
}
.status.error { background: #fff0ef; color: #9f2424; }
.status.success { background: #eaf8ef; color: #176b45; }
.status strong { display: block; margin-bottom: 3px; }
.small { font-size: 12px; color: #738096; }
.keypad {
  display: flex; gap: 6px; flex-wrap: wrap;
  justify-content: center; margin: 14px auto 0; max-width: 650px;
}
.keypad button { min-width: 36px; padding: 8px 10px; }
.footer { text-align: center; color: #748095; font-size: 12px; margin-top: 18px; }
@media(max-width: 420px) {
  body { padding: 14px 7px 30px; }
  .panel { padding: 13px; }
  .button { padding: 10px 12px; }
  .cell { min-width: 29px; }
}
</style>
</head>
<body>
<main class="app">
  <header class="hero">
    <h1>스도쿠</h1>
    <p>직접 풀이하거나 새로운 문제에 도전해 보세요.</p>
  </header>

  <section id="home" class="panel">
    <h2 class="subheading">무엇을 할까요?</h2>
    <div class="choices">
      <button class="button primary" id="goSolve">풀이</button>
      <button class="button dark" id="goPuzzle">문제</button>
    </div>
  </section>

  <section id="setup" class="panel hidden">
    <h2 class="subheading" id="setupTitle">규격 선택</h2>
    <div id="sizeChoices" class="choices">
      <button class="button primary" data-size="9">9 × 9</button>
      <button class="button primary" data-size="16">16 × 16</button>
    </div>
    <div id="difficultyChoices" class="choices hidden">
      <button class="button" data-level="하">하 · 26개 단서</button>
      <button class="button" data-level="중">중 · 23개 단서</button>
      <button class="button" data-level="상">상 · 20개 단서</button>
      <button class="button dark" data-level="최상">최상 · 17개 단서</button>
    </div>
    <div class="toolbar">
      <button class="button" id="backHome">처음으로</button>
    </div>
  </section>

  <section id="game" class="panel hidden">
    <div class="toolbar">
      <span id="modeLabel"><b>풀이 모드</b></span>
      <button class="button" id="newGame">새로 시작</button>
      <button class="button" id="homeFromGame">처음으로</button>
    </div>

    <div class="board-wrap">
      <div id="board" class="board" role="group" aria-label="스도쿠 판"></div>
    </div>

    <div id="keypad" class="keypad"></div>

    <div class="toolbar" id="solveActions">
      <button class="button" id="clearCell">칸 지우기</button>
      <button class="button primary" id="solveBtn">완료</button>
    </div>

    <div class="toolbar hidden" id="puzzleActions">
      <button class="button" id="eraseBtn">선택 칸 지우기</button>
      <button class="button" id="checkBtn">정답 확인</button>
      <button class="button primary" id="showHint">힌트</button>
    </div>

    <div id="status" class="status" aria-live="polite">
      빈칸을 선택하고 숫자 또는 기호를 입력하세요.
    </div>

    <p class="small" style="text-align:center">
      9×9: 1–9 · 16×16: 1–9, A–G · 키보드 입력도 지원합니다.
    </p>
  </section>

  <p class="footer">
    브라우저에서 동작하며 입력한 내용은 서버로 전송되지 않습니다.
  </p>
</main>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const home = $('#home');
  const setup = $('#setup');
  const game = $('#game');
  const boardEl = $('#board');
  const statusEl = $('#status');

  let mode = 'solve';
  let N = 9;
  let box = 3;
  let grid = [];
  let givens = [];
  let solution = null;
  let selected = -1;
  let level = '최상';

  const symbols = n => n === 9
    ? '123456789'
    : '123456789ABCDEFG';

  const valOf = c => symbols(N).indexOf(String(c).toUpperCase()) + 1;
  const charOf = v => v ? symbols(N)[v - 1] : '';

  function show(which) {
    home.classList.toggle('hidden', which !== 'home');
    setup.classList.toggle('hidden', which !== 'setup');
    game.classList.toggle('hidden', which !== 'game');
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    }[c]));
  }

  function say(title, detail = '', type = '') {
    statusEl.className = 'status' + (type ? ' ' + type : '');
    statusEl.innerHTML =
      '<strong>' + escapeHtml(title) + '</strong>' +
      (detail ? '<span>' + escapeHtml(detail) + '</span>' : '');
  }

  // 행, 열, 해당 구역에 중복된 기호가 있는지 검사
  function validate(g, n = N) {
    const b = Math.sqrt(n);

    for (let r = 0; r < n; r++) {
      for (let c = 0; c < n; c++) {
        const v = g[r * n + c];
        if (!v) continue;

        for (let k = 0; k < n; k++) {
          if (k !== c && g[r * n + k] === v) {
            return {
              ok: false,
              reason: `${r + 1}행에 같은 기호가 중복됩니다.`
            };
          }
          if (k !== r && g[k * n + c] === v) {
            return {
              ok: false,
              reason: `${c + 1}열에 같은 기호가 중복됩니다.`
            };
          }
        }

        const br = Math.floor(r / b) * b;
        const bc = Math.floor(c / b) * b;

        for (let rr = br; rr < br + b; rr++) {
          for (let cc = bc; cc < bc + b; cc++) {
            if (
              (rr !== r || cc !== c) &&
              g[rr * n + cc] === v
            ) {
              return {
                ok: false,
                reason: `같은 ${b}×${b} 구역에 같은 기호가 중복됩니다.`
              };
            }
          }
        }
      }
    }

    return { ok: true };
  }

  // 백트래킹으로 해답 탐색. limit=2이면 복수 해답도 판별.
  function solveGrid(input, n = N, limit = 2) {
    const b = Math.sqrt(n);
    const g = input.slice();
    const full = (1 << n) - 1;

    let count = 0;
    let first = null;

    function candidates(i) {
      const r = Math.floor(i / n);
      const c = i % n;
      let used = 0;

      for (let k = 0; k < n; k++) {
        if (g[r * n + k]) used |= 1 << (g[r * n + k] - 1);
        if (g[k * n + c]) used |= 1 << (g[k * n + c] - 1);
      }

      const br = Math.floor(r / b) * b;
      const bc = Math.floor(c / b) * b;

      for (let rr = br; rr < br + b; rr++) {
        for (let cc = bc; cc < bc + b; cc++) {
          if (g[rr * n + cc]) {
            used |= 1 << (g[rr * n + cc] - 1);
          }
        }
      }

      return full & ~used;
    }

    function dfs() {
      if (count >= limit) return;

      let best = -1;
      let bestMask = 0;
      let fewest = n + 1;

      for (let i = 0; i < g.length; i++) {
        if (g[i]) continue;

        const mask = candidates(i);
        let bits = 0;

        for (let x = mask; x; x &= x - 1) bits++;

        if (bits === 0) return;

        if (bits < fewest) {
          best = i;
          bestMask = mask;
          fewest = bits;
          if (bits === 1) break;
        }
      }

      if (best === -1) {
        count++;
        if (!first) first = g.slice();
        return;
      }

      while (bestMask && count < limit) {
        const bit = bestMask & -bestMask;
        bestMask -= bit;
        g[best] = 32 - Math.clz32(bit);
        dfs();
        g[best] = 0;
      }
    }

    dfs();
    return { count, solution: first };
  }

  function render() {
    boardEl.innerHTML = '';
    boardEl.className = 'board' + (N === 16 ? ' size16' : '');
    boardEl.style.gridTemplateColumns = `repeat(${N}, auto)`;

    for (let i = 0; i < N * N; i++) {
      const inp = document.createElement('input');
      inp.className = 'cell';
      inp.type = 'text';
      inp.inputMode = 'none';
      inp.maxLength = 1;
      inp.autocomplete = 'off';
      inp.spellcheck = false;
      inp.setAttribute(
        'aria-label',
        `${Math.floor(i / N) + 1}행 ${i % N + 1}열`
      );
      inp.dataset.i = i;
      inp.value = charOf(grid[i]);

      const rr = Math.floor(i / N);
      const cc = i % N;

      // 9×9: 3칸마다, 16×16: 4칸마다 굵은 경계선
      if ((cc + 1) % box === 0 && cc !== N - 1) {
        inp.classList.add('box-right');
      }
      if ((rr + 1) % box === 0 && rr !== N - 1) {
        inp.classList.add('box-bottom');
      }

      if (givens[i]) {
        inp.readOnly = true;
        inp.classList.add('given');
      }

      inp.addEventListener('focus', () => selectCell(i));
      inp.addEventListener('click', () => selectCell(i));

      inp.addEventListener('input', () => {
        if (givens[i]) return;

        const v = valOf(inp.value);
        grid[i] = v > 0 && v <= N ? v : 0;
        inp.value = charOf(grid[i]);

        // 이전의 풀이 불가능/완료 메시지를 현재 입력 상태에 맞게 갱신
        say(
          '입력 변경됨',
          '현재 입력한 판을 다시 확인하려면 완료를 누르세요.'
        );
        paintConflicts();
      });

      inp.addEventListener('keydown', e => {
        if (e.key === 'Backspace' || e.key === 'Delete') {
          e.preventDefault();
          setCell(i, 0);
        } else if (
          ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)
        ) {
          e.preventDefault();
          const d = e.key === 'ArrowUp' ? -N
            : e.key === 'ArrowDown' ? N
            : e.key === 'ArrowLeft' ? -1 : 1;

          selectCell(Math.max(0, Math.min(N * N - 1, i + d)));
        }
      });

      boardEl.appendChild(inp);
    }

    $('#keypad').innerHTML = '';

    for (let v = 1; v <= N; v++) {
      const btn = document.createElement('button');
      btn.className = 'button';
      btn.textContent = charOf(v);
      btn.addEventListener('click', () => {
        if (selected >= 0) setCell(selected, v);
      });
      $('#keypad').appendChild(btn);
    }

    paintConflicts();
  }

  function selectCell(i) {
    selected = i;

    document.querySelectorAll('.cell').forEach((el, j) => {
      const sameRow = Math.floor(i / N) === Math.floor(j / N);
      const sameCol = i % N === j % N;
      const sameBox =
        Math.floor(Math.floor(i / N) / box) ===
          Math.floor(Math.floor(j / N) / box) &&
        Math.floor((i % N) / box) === Math.floor((j % N) / box);

      el.classList.toggle('selected', i === j);
      el.classList.toggle('related', i !== j && (sameRow || sameCol || sameBox));
    });
  }

  function setCell(i, v) {
    if (i < 0 || givens[i]) return;

    grid[i] = v;
    const el = boardEl.children[i];
    el.value = charOf(v);

    say('입력 변경됨', '현재 입력한 판을 다시 확인하려면 완료를 누르세요.');
    paintConflicts();
    el.focus();
  }

  function paintConflicts() {
    document.querySelectorAll('.cell').forEach(el => {
      el.classList.remove('conflict');
    });

    const seen = new Map();

    for (let i = 0; i < grid.length; i++) {
      if (!grid[i]) continue;

      const r = Math.floor(i / N);
      const c = i % N;
      const br = Math.floor(r / box);
      const bc = Math.floor(c / box);

      const keys = [
        `r${r}v${grid[i]}`,
        `c${c}v${grid[i]}`,
        `b${br},${bc}v${grid[i]}`
      ];

      for (const k of keys) {
        if (seen.has(k)) {
          boardEl.children[i].classList.add('conflict');
          boardEl.children[seen.get(k)].classList.add('conflict');
        } else {
          seen.set(k, i);
        }
      }
    }
  }

  function beginSolve(size) {
    mode = 'solve';
    N = size;
    box = Math.sqrt(N);
    grid = Array(N * N).fill(0);
    givens = grid.map(() => false);
    solution = null;
    selected = -1;

    $('#modeLabel').innerHTML = `<b>풀이 모드 · ${N}×${N}</b>`;
    $('#solveActions').classList.remove('hidden');
    $('#puzzleActions').classList.add('hidden');

    render();
    say('빈 스도쿠 판입니다.', '직접 단서를 입력한 뒤 완료를 누르세요.');
    show('game');
  }

  // 검증된 17개 단서 스도쿠를 기반으로 생성
  const baseRows = [
    '000000010',
    '400000000',
    '020000000',
    '000050407',
    '008000300',
    '001090000',
    '300400200',
    '050100000',
    '000806000'
  ];

  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function permuteSudoku(src) {
    let g = src.slice();
    const digitMap = [0, ...shuffle([1,2,3,4,5,6,7,8,9])];
    g = g.map(v => v ? digitMap[v] : 0);

    const bands = shuffle([0, 1, 2]);
    const rows = [];

    for (const band of bands) {
      for (const r of shuffle([0, 1, 2])) {
        rows.push(band * 3 + r);
      }
    }

    g = rows.flatMap(r => g.slice(r * 9, r * 9 + 9));

    const stacks = shuffle([0, 1, 2]);
    const cols = [];

    for (const st of stacks) {
      for (const c of shuffle([0, 1, 2])) {
        cols.push(st * 3 + c);
      }
    }

    g = g.map((_, i) => g[Math.floor(i / 9) * 9 + cols[i % 9]]);

    if (Math.random() < 0.5) {
      const t = Array(81);
      for (let r = 0; r < 9; r++) {
        for (let c = 0; c < 9; c++) {
          t[c * 9 + r] = g[r * 9 + c];
        }
      }
      g = t;
    }

    return g;
  }

  function makePuzzle(lvl) {
    N = 9;
    box = 3;
    level = lvl;

    const target = { '최상': 17, '상': 20, '중': 23, '하': 26 }[lvl] || 17;
    const base = baseRows.join('').split('').map(Number);

    let transformed = permuteSudoku(base);
    let solved = solveGrid(transformed, 9, 2);

    for (let tries = 0; tries < 20 && solved.count !== 1; tries++) {
      transformed = permuteSudoku(base);
      solved = solveGrid(transformed, 9, 2);
    }

    if (solved.count !== 1) {
      say('문제 생성 실패', '기준 퍼즐 검증에 실패했습니다. 다시 시도해 주세요.', 'error');
      return;
    }

    const answer = solved.solution;
    grid = transformed.slice();
    const blanks = shuffle(Array.from({ length: 81 }, (_, i) => i));
    let clues = grid.filter(Boolean).length;

    // 해답 값을 추가하면 유일한 해답이라는 성질은 유지된다.
    while (clues < target) {
      const i = blanks.pop();
      if (i === undefined) break;
      grid[i] = answer[i];
      clues++;
    }

    givens = grid.map(Boolean);
    solution = answer;
    selected = -1;
    mode = 'puzzle';

    $('#modeLabel').innerHTML = `<b>문제 모드 · ${lvl} · 단서 ${clues}개</b>`;
    $('#solveActions').classList.add('hidden');
    $('#puzzleActions').classList.remove('hidden');

    render();
    say(
      `${lvl} 난이도 문제입니다.`,
      `단서 ${clues}개 · 정답을 입력하고 정답 확인을 눌러 보세요.`
    );
    show('game');
  }

  // 중요: 완료 버튼을 누를 때마다 현재 grid로 새롭게 검사한다.
  function finishSolve() {
    // 1. 규칙 위반 검사
    const bad = validate(grid);

    if (!bad.ok) {
      say('풀이 불가능', bad.reason, 'error');
      return;
    }

    // 2. 현재 입력으로 해답을 다시 탐색
    const result = solveGrid(grid, N, 2);

    if (result.count === 0) {
      say(
        '풀이 불가능',
        '현재 입력한 단서와 규칙을 동시에 만족하는 해답이 없습니다.',
        'error'
      );
      return;
    }

    if (result.count > 1) {
      say(
        '풀이 불가능',
        '단서가 부족해 해답이 여러 개입니다. 해답을 하나로 정할 수 있도록 단서를 더 입력해 주세요.',
        'error'
      );
      return;
    }

    // 3. 해답 표시. 입력 칸을 잠그지 않아 다시 수정하고 재검사할 수 있다.
    grid = result.solution.slice();
    solution = result.solution.slice();

    // 풀이 모드에서는 사용자가 입력한 칸도 고정하지 않는다.
    // 따라서 이후 숫자를 수정하거나 지우고 완료를 다시 누를 수 있다.
    givens = grid.map(() => false);

    render();

    document.querySelectorAll('.cell').forEach(el => {
      el.classList.add('solved');
    });

    say(
      '풀이 완료',
      '유일한 해답을 찾았습니다. 숫자를 수정한 뒤 완료를 다시 눌러 재검사할 수 있습니다.',
      'success'
    );
  }

  function checkPuzzle() {
    const bad = validate(grid);

    if (!bad.ok) {
      say('아직 정답이 아닙니다.', bad.reason, 'error');
      return;
    }

    if (grid.some((v, i) => v !== solution[i])) {
      say('아직 정답이 아닙니다.', '입력한 숫자를 다시 확인해 보세요.', 'error');
      return;
    }

    say('정답입니다!', '스도쿠를 완성했습니다.', 'success');
  }

  function hint() {
    let i = selected;

    if (i < 0 || givens[i]) {
      i = grid.findIndex((v, j) => !givens[j] && !v);
    }

    if (i < 0) {
      say('힌트', '힌트를 줄 빈칸이 없습니다.');
      return;
    }

    grid[i] = solution[i];
    givens[i] = true;

    const el = boardEl.children[i];
    el.value = charOf(grid[i]);
    el.classList.add('given');

    selectCell(i);
    say(
      '힌트 제공',
      `${Math.floor(i / N) + 1}행 ${i % N + 1}열에 ${charOf(grid[i])}을(를) 채웠습니다.`,
      'success'
    );
  }

  $('#goSolve').onclick = () => {
    show('setup');
    $('#setupTitle').textContent = '풀이할 스도쿠 규격을 선택하세요';
    $('#sizeChoices').classList.remove('hidden');
    $('#difficultyChoices').classList.add('hidden');
  };

  $('#goPuzzle').onclick = () => {
    show('setup');
    $('#setupTitle').textContent = '문제 난이도를 선택하세요';
    $('#sizeChoices').classList.add('hidden');
    $('#difficultyChoices').classList.remove('hidden');
  };

  $('#backHome').onclick = () => show('home');
  $('#homeFromGame').onclick = () => show('home');

  $('#newGame').onclick = () => {
    if (mode === 'puzzle') {
      makePuzzle(level);
    } else {
      beginSolve(N);
    }
  };

  document.querySelectorAll('[data-size]').forEach(b => {
    b.onclick = () => beginSolve(Number(b.dataset.size));
  });

  document.querySelectorAll('[data-level]').forEach(b => {
    b.onclick = () => makePuzzle(b.dataset.level);
  });

  $('#solveBtn').onclick = finishSolve;
  $('#clearCell').onclick = () => setCell(selected, 0);
  $('#eraseBtn').onclick = () => setCell(selected, 0);
  $('#checkBtn').onclick = checkPuzzle;
  $('#showHint').onclick = hint;

  document.addEventListener('keydown', e => {
    if (
      game.classList.contains('hidden') ||
      selected < 0 ||
      e.ctrlKey ||
      e.altKey ||
      e.metaKey
    ) return;

    if (e.key === 'Backspace' || e.key === 'Delete') {
      setCell(selected, 0);
      return;
    }

    const v = valOf(e.key);
    if (v > 0 && v <= N) setCell(selected, v);
  });
})();
</script>
</body>
</html>
